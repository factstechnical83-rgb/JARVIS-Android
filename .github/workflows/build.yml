name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o JARVIS-Android-GitHub-Ready.zip -d extracted_project
          find extracted_project -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/* . || cp -r extracted_project/* .
          touch .env
          touch .env.example
          echo "OPENAI_API_KEY=dummy" >> .env
          echo "OPENAI_API_KEY=dummy" >> .env.example

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper & Build APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-app-debug
          path: app/build/outputs/apk/debug/*.apk
          
